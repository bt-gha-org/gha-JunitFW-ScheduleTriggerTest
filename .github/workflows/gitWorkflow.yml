name: Java CI

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1-5'
    - cron: '25 8 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🤖 Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11

      - name: Build & run tests
        run: mvn test

